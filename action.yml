name: "PR Validation Agent"
description: "Validate PRs with tests, AST-based new-function detection, and LangGraph feedback."
inputs:
  config-path:
    description: "Path to repository validation config."
    required: false
    default: ".github/pr-validation.yml"
  langgraph-url:
    description: "Base URL of the LangGraph service."
    required: true
  python-version:
    description: "Python version used by the validation runner."
    required: false
    default: "3.11"
  uv-version:
    description: "Pinned uv version used to create the isolated validation environment."
    required: false
    default: "0.10.7"
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    - name: Install isolated Python
      shell: bash
      run: uv python install "${{ inputs.python-version }}"
    - name: Sync isolated validation runner
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        uv sync --frozen --no-dev
    - name: Validate pull request
      shell: bash
      env:
        PR_VALIDATION_CONFIG: ${{ inputs.config-path }}
        LANGGRAPH_SERVICE_URL: ${{ inputs.langgraph-url }}
      run: "$GITHUB_ACTION_PATH/.venv/bin/pr-validation-ci"
