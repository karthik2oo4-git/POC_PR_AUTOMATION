[project]
name = "pr-validation-agent"
version = "0.1.0"
description = "Production-ready PR validation with GitHub Actions and GitHub-native unit-test gating."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[project.scripts]
pr-validation-ci = "pr_validation_agent.ci.runner:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_validation_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".ruff_cache",
  ".uv-cache",
  ".venv",
  "__pycache__",
]
