version: 1

status:
  context: "pr-unit-test-validation"
  target_url: ""

tests:
  command: "uv run pytest -q --maxfail=1"
  timeout_seconds: 900
  parallel_hint: ""
  log_max_bytes: 120000

setup:
  commands:
    - "uv sync --frozen"
  timeout_seconds: 600

reviewers:
  request_review_when_passed: false
  fallback_reviewers: []
  fallback_teams: []

labels:
  enabled: true
  remove_stale: true
  create_missing: true
  test_failed: "test-failed"
  ready_for_review: "ready-for-review"
  merge_conflict: "merge-conflict"

auto_merge:
  enabled: false
  method: "SQUASH"

comments:
  marker: "<!-- pr-validation-agent:summary -->"
  max_log_lines: 120
